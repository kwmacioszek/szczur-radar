# Alembic configuration for szczur-radar-api.
#
# The database URL is NOT stored here: migrations/env.py reads DATABASE_URL
# from the environment, exactly like the application (app/database.py).
# Run from this directory:  uv run alembic upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Revision ids are explicit and readable (e.g. 0001_create_users), passed via
# `alembic revision --rev-id <NNNN>_<slug>`; the file is named after the id.
file_template = %%(rev)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
