[project]
name = "szczur-radar-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "hypercorn>=0.18.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "db: needs Postgres via TEST_DATABASE_URL; skipped without it unless REQUIRE_DB_TESTS=1 (then the run fails)",
]
