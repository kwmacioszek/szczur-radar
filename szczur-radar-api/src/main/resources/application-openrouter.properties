# LLM_API_PROVIDER=openrouter: OpenRouter's OpenAI-compatible API. LLM_MODEL is the exact model id
# from the OpenRouter catalog (not just a display name), registered as the only custom model.
# The OpenAI SDK appends chat/completions to the base URL, so requests go to
# https://openrouter.ai/api/v1/chat/completions (no second /v1).
embabel.agent.platform.models.openai.custom.api-key=${LLM_API_KEY}
embabel.agent.platform.models.openai.custom.base-url=https://openrouter.ai/api/v1
embabel.agent.platform.models.openai.custom.models=${LLM_MODEL}
spring.autoconfigure.exclude=\
  com.embabel.agent.autoconfigure.models.googlegenai.AgentGoogleGenAiAutoConfiguration,\
  com.embabel.agent.autoconfigure.models.deepseek.AgentDeepSeekAutoConfiguration
