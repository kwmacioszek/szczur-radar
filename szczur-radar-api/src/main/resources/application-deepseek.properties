# LLM_API_PROVIDER=deepseek: DeepSeek directly. LLM_MODEL is one of the models Embabel registers:
# deepseek-v4-flash, deepseek-v4-pro, deepseek-chat, deepseek-reasoner.
embabel.agent.platform.models.deepseek.api-key=${LLM_API_KEY}
embabel.agent.platform.models.deepseek.base-url=https://api.deepseek.com
spring.autoconfigure.exclude=\
  com.embabel.agent.autoconfigure.models.googlegenai.AgentGoogleGenAiAutoConfiguration,\
  com.embabel.agent.autoconfigure.models.openai.custom.AgentOpenAiCustomAutoConfiguration
