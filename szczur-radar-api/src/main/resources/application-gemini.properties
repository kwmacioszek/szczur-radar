# LLM_API_PROVIDER=gemini: native Google GenAI with a Google AI Studio key (no Vertex AI).
# LLM_MODEL is a Gemini model id known to Embabel, e.g. gemini-3.1-flash-lite.
embabel.agent.platform.models.googlegenai.api-key=${LLM_API_KEY}
spring.autoconfigure.exclude=\
  com.embabel.agent.autoconfigure.models.deepseek.AgentDeepSeekAutoConfiguration,\
  com.embabel.agent.autoconfigure.models.openai.custom.AgentOpenAiCustomAutoConfiguration
