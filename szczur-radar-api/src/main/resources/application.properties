spring.application.name=szczur-radar-api

# Railway sets PORT=8000 (.railway/railway.ts). The JVM binds the wildcard address dual-stack
# (IPv6 for Railway private networking, IPv4 for the Railway healthcheck): do not set server.address.
server.port=${PORT:8000}

# JDBC from Railway's split Postgres variables (no DATABASE_URL parsing). The Hikari pool is
# created lazily on first use, so the server and /api/health start without a reachable database.
# reWriteBatchedInserts: the driver sends a JDBC batch of INSERTs as multi-row INSERTs.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?reWriteBatchedInserts=true
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# Migrations run only through the `migrate` command (Railway pre-deploy), never at server start.
spring.flyway.enabled=false

# JPA (Hibernate) maps entities onto the schema owned by Flyway: it never creates or changes tables
# (JpaSchemaIT validates the mapping against the migrated schema). Hibernate must not touch the
# database at startup either — the server and /api/health start without a reachable database — so
# JDBC metadata access at boot is off and the database is named here instead (Postgres 18 on
# Railway, compose.local.yaml and Testcontainers).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.jakarta.persistence.database-product-name=PostgreSQL
spring.jpa.properties.jakarta.persistence.database-major-version=18
spring.jpa.open-in-view=false
# Inserts of one transaction go to the database in JDBC batches (e.g. the pipeline's store step,
# pipeline/step/PostStore), not one round trip per row.
spring.jpa.properties.hibernate.jdbc.batch_size=100

# Sessions live in Postgres (Spring Session JDBC: SPRING_SESSION* tables created by Flyway V2), so
# they survive API sleep and restarts. A session expires after 30 days of inactivity; the cookie's
# Max-Age equals this timeout and is renewed on successful API calls (config/SessionConfig).
spring.session.timeout=30d
spring.session.jdbc.initialize-schema=never

# Request bodies are closed models: unknown fields are a 400 invalid_request.
spring.jackson.deserialization.fail-on-unknown-properties=true

# LLM provider (Embabel): one provider per run, selected by LLM_API_PROVIDER (gemini | deepseek |
# openrouter) together with LLM_MODEL and LLM_API_KEY; validated at startup by
# config/LlmProviderProperties. The provider name activates application-<provider>.properties, which
# maps the key and model onto Embabel and re-enables only that provider. By default all three are
# off, so a missing key of an unselected provider never blocks startup.
spring.profiles.include=${LLM_API_PROVIDER:}
embabel.models.default-llm=${LLM_MODEL:}
spring.autoconfigure.exclude=\
  com.embabel.agent.autoconfigure.models.googlegenai.AgentGoogleGenAiAutoConfiguration,\
  com.embabel.agent.autoconfigure.models.deepseek.AgentDeepSeekAutoConfiguration,\
  com.embabel.agent.autoconfigure.models.openai.custom.AgentOpenAiCustomAutoConfiguration
