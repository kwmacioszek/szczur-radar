# A test that runs past its @Timeout prints a dump of every thread to stdout before it is interrupted, so the
# CI job's log shows where it hung (S-26: run 39133095273 timed out in the dispatcher's test without a trace).
# Read by unit tests and ITs alike. No default timeout: only the classes that declare @Timeout have one.
junit.jupiter.execution.timeout.threaddump.enabled=true
