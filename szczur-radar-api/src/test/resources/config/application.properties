# Test-only overrides, layered on top of src/main/resources/application.properties
# (Spring Boot reads classpath:/config/application.properties after classpath:/application.properties).
#
# No scheduled cleanup of expired sessions in tests: many test contexts never create the
# SPRING_SESSION tables (no migrations) or have no database at all, and the task would log
# "relation spring_session does not exist" / "connection refused" every minute. Tests age sessions
# explicitly instead (AuthIT).
spring.session.jdbc.cleanup-cron=-
