name: CI

# Runs on every push to main and on every PR. Intentionally NOT path-filtered:
# Railway's "Wait for CI" evaluates the whole workflow conclusion, and a skipped
# required workflow never blocks — path filtering would silently defeat the gate.
#
# Runner switch (repository variables, no commit needed; tools/ci-runner/README.md):
# every job runs on the runner label in CI_RUNNER_PR (pull_request) or
# CI_RUNNER_MAIN (push to main), else CI_RUNNER, else GitHub's ubuntu-latest.
# E.g. `gh variable set CI_RUNNER --body szczur-ci` moves all jobs to the
# self-hosted runners, `gh variable delete CI_RUNNER` moves them back. A label
# no online runner has leaves jobs queued, and Railway skips the deploy after 2 h.
# Self-hosted runners are persistent: jobs must not leave named containers behind.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (Maven verify)
    runs-on: ${{ (github.event_name == 'pull_request' && vars.CI_RUNNER_PR) || (github.event_name == 'push' && vars.CI_RUNNER_MAIN) || vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: szczur-radar-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: szczur-radar-api/pom.xml
      # Every Spring context (server, commands, *IT) reads and checks the one
      # LLM provider chosen by these three settings (szczur-radar-api/README.md).
      # Provider and model are repository variables, the key a secret; nothing
      # calls the LLM in CI. Missing settings fail the job, never skip tests.
      - name: Check LLM configuration
        env:
          LLM_API_PROVIDER: ${{ vars.LLM_API_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          missing=""
          [ -n "$LLM_API_PROVIDER" ] || missing="$missing LLM_API_PROVIDER (variable)"
          [ -n "$LLM_MODEL" ] || missing="$missing LLM_MODEL (variable)"
          [ -n "$LLM_API_KEY" ] || missing="$missing LLM_API_KEY (secret)"
          if [ -n "$missing" ]; then
            echo "::error::GitHub Actions settings missing:$missing"
            exit 1
          fi
      # Unit tests (*Test, Surefire) + integration tests (*IT, Failsafe) against
      # a Testcontainers PostgreSQL 18 (Docker is preinstalled on ubuntu-latest
      # and installed on the self-hosted runners by tools/ci-runner/setup.sh).
      # Without Docker the integration tests fail rather than skip.
      - name: Build and test
        env:
          LLM_API_PROVIDER: ${{ vars.LLM_API_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: ./mvnw -B verify

  web-unit:
    name: web unit tests (Vitest)
    runs-on: ${{ (github.event_name == 'pull_request' && vars.CI_RUNNER_PR) || (github.event_name == 'push' && vars.CI_RUNNER_MAIN) || vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: szczur-radar-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: szczur-radar-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  web-container-smoke:
    name: web container smoke test
    runs-on: ${{ (github.event_name == 'pull_request' && vars.CI_RUNNER_PR) || (github.event_name == 'push' && vars.CI_RUNNER_MAIN) || vars.CI_RUNNER || 'ubuntu-latest' }}
    # The image build runs `npm ci && npm run build` (vue-tsc typecheck + Vite
    # build) against the real production Dockerfile, so this job IS also the
    # frontend typecheck/build gate — no separate host build job, which would
    # only re-run the same Vite build.
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -t szczur-radar-web ./szczur-radar-web
      - name: Run container
        run: |
          docker rm -f web >/dev/null 2>&1 || true
          docker run -d --name web -e PORT=8080 -p 8080:8080 szczur-radar-web
      - name: Smoke test /healthz and /
        run: |
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::web container did not become ready"
            docker logs web
            exit 1
          fi
          curl -fsS http://localhost:8080/healthz | grep -q "ok"
          # SPA fallback must serve index.html (the app mount point) for unknown routes.
          curl -fsS http://localhost:8080/some/deep/route | grep -q 'id="app"'
      - name: Container logs
        if: always()
        run: |
          docker logs web || true
          docker rm -f web >/dev/null 2>&1 || true

  api-container-smoke:
    name: api container smoke test
    runs-on: ${{ (github.event_name == 'pull_request' && vars.CI_RUNNER_PR) || (github.event_name == 'push' && vars.CI_RUNNER_MAIN) || vars.CI_RUNNER || 'ubuntu-latest' }}
    # Builds the real szczur-radar-api/Dockerfile (the one Railway builds) and
    # runs it the way Railway does: the pre-deploy command (`migrate`) against
    # PostgreSQL 18, then the server (image ENTRYPOINT, no arguments) until
    # /api/health and /api/ready answer. Catches a wrong jar path, missing
    # resources or a root user before Railway deploys the image.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: szczur_ci
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: szczur_radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U szczur_ci -d szczur_radar_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: szczur_radar_test
      PGUSER: szczur_ci
      PGPASSWORD: ci_only
      # Same LLM settings as the backend job: every Spring context needs them.
      LLM_API_PROVIDER: ${{ vars.LLM_API_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t szczur-radar-api ./szczur-radar-api
      - name: Image runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id szczur-radar-api -u)
          echo "image user uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::API image runs as root"
            exit 1
          fi
      # `-e NAME` (no value) passes the job's env through to the container.
      # Exactly Railway's preDeploy (.railway/railway.ts): it replaces the image
      # ENTRYPOINT and resolves target/… against WORKDIR /app.
      - name: Run migrations (Railway pre-deploy command)
        run: |
          docker run --rm --network host --entrypoint java \
            -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD \
            -e LLM_API_PROVIDER -e LLM_MODEL -e LLM_API_KEY \
            szczur-radar-api -jar target/szczur-radar-api.jar migrate
      - name: Run server
        run: |
          docker rm -f api >/dev/null 2>&1 || true
          docker run -d --name api --network host -e PORT=8000 \
            -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD \
            -e LLM_API_PROVIDER -e LLM_MODEL -e LLM_API_KEY \
            szczur-radar-api
      - name: Smoke test /api/health and /api/ready
        run: |
          ready=0
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8000/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::api container did not become ready"
            docker logs api
            exit 1
          fi
          curl -fsS http://localhost:8000/api/ready
      - name: Container logs
        if: always()
        run: |
          docker logs api || true
          docker rm -f api >/dev/null 2>&1 || true

  db-backup-test:
    name: db backup test (tools/db-backup)
    runs-on: ${{ (github.event_name == 'pull_request' && vars.CI_RUNNER_PR) || (github.event_name == 'push' && vars.CI_RUNNER_MAIN) || vars.CI_RUNNER || 'ubuntu-latest' }}
    # The backup cron (F-01) restores every dump and checks the app's tables by
    # name (tools/db-backup/restore-check.sh, backup.sh). tools/db-backup/test.sh
    # applies the repo's Flyway migrations to Postgres 18, runs a backup, its
    # restore check, the retention and nas-retention.sh in Docker, so a migration
    # that breaks the backup fails this PR instead of the 02:00 run on production.
    steps:
      - uses: actions/checkout@v4
      - name: Backup tool end to end
        run: tools/db-backup/test.sh

  pipeline-trigger-test:
    name: pipeline trigger test (tools/pipeline-trigger)
    runs-on: ${{ (github.event_name == 'pull_request' && vars.CI_RUNNER_PR) || (github.event_name == 'push' && vars.CI_RUNNER_MAIN) || vars.CI_RUNNER || 'ubuntu-latest' }}
    # The daily-run cron (S-05) reports a failed night only through its exit code, and Railway gives
    # it no manual trigger. tools/pipeline-trigger/test.sh runs the image against a stub API in Docker
    # (wake-up retries, 409 busy, 401, every time limit, the result of each run as the exit code), so
    # a broken trigger fails this PR instead of the 00:30 UTC run on production.
    steps:
      - uses: actions/checkout@v4
      - name: Trigger tool against a stub API
        run: tools/pipeline-trigger/test.sh

  deploy-gate-test:
    name: deploy gate test (tools/deploy-gate)
    runs-on: ${{ (github.event_name == 'pull_request' && vars.CI_RUNNER_PR) || (github.event_name == 'push' && vars.CI_RUNNER_MAIN) || vars.CI_RUNNER || 'ubuntu-latest' }}
    # The gate of railway-config (S-14) decides alone whether an unattended apply
    # may change production. tools/deploy-gate/test.sh runs its rules against plan
    # fixtures, and the deploy guard and the post-apply check against a stub API
    # (Python) and a stub railway CLI (bash, jq, curl, python3; no Railway, no
    # Docker), so a rule that would let a destructive or source change through, or
    # a guard that would deploy during a pipeline run, fails this PR instead of
    # the next apply.
    steps:
      - uses: actions/checkout@v4
      - name: Gate, guard and post-apply check against fixtures and stubs
        run: tools/deploy-gate/test.sh

  healthchecks-test:
    name: healthchecks test (tools/healthchecks)
    runs-on: ${{ (github.event_name == 'pull_request' && vars.CI_RUNNER_PR) || (github.event_name == 'push' && vars.CI_RUNNER_MAIN) || vars.CI_RUNNER || 'ubuntu-latest' }}
    # The operator's script for the healthchecks.io checks of the out-of-app alert channel (F-04):
    # the crons' and the API's checks, their schedules and grace, the arming check-in. It runs on the
    # operator's machine with a key never given to CI, so tools/healthchecks/test.sh tests it against a
    # stub curl (bash, jq; no healthchecks.io, no Docker): a wrong schedule or grace, a check left
    # unarmed (it would never alert) or a leaked key or ping URL fails this PR.
    steps:
      - uses: actions/checkout@v4
      - name: Check script against a stub curl
        run: tools/healthchecks/test.sh

  railway-config:
    name: railway config (plan + apply IaC)
    runs-on: ${{ (github.event_name == 'pull_request' && vars.CI_RUNNER_PR) || (github.event_name == 'push' && vars.CI_RUNNER_MAIN) || vars.CI_RUNNER || 'ubuntu-latest' }}
    # Applies .railway/railway.ts to the matching Railway environment. Because
    # Railway "Wait for CI" waits for this whole workflow, the service config
    # (e.g. preDeploy) is in place BEFORE Railway deploys the code.
    #   pull_request -> szczur-radar-pr-<N>   (never production)
    #   push to main -> production
    # Fork PRs get no secrets and no Railway PR env: skipped deliberately.
    # It runs only after every test job is green (S-14): a red test skips the
    # apply, and the failed workflow makes Wait for CI skip the code deploy too.
    # This keeps "config before code": Wait for CI waits for the conclusion of
    # the whole workflow, this job included, so the code still deploys after
    # the apply.
    needs:
      - backend
      - web-unit
      - web-container-smoke
      - api-container-smoke
      - db-backup-test
      - pipeline-trigger-test
      - deploy-gate-test
      - healthchecks-test
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # The deploy guard reads this run's creation time (REST API, actions: read);
    # checkout needs contents: read. A permissions block drops every other scope.
    permissions:
      contents: read
      actions: read
    # Above the guard (DEPLOY_GUARD_TIMEOUT) plus the post-apply check
    # (DEPLOY_VERIFY_TIMEOUT, then /api/ready for DEPLOY_GUARD_WAKE_TIMEOUT),
    # with room for the plan and the apply. Railway's Wait for CI gives up 2 h
    # after the push; the guard's DEPLOY_GUARD_DEADLINE keeps inside that.
    timeout-minutes: 115
    # One apply per environment at a time; never cancel a running apply. A
    # guard waiting for a pipeline run holds the group: a third push meanwhile
    # cancels the pending second run (the third contains its commit).
    concurrency:
      group: railway-config-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
      cancel-in-progress: false
    env:
      # WORKSPACE token (a project token covers one environment only and cannot
      # reach PR envs). Never `railway link`: with a workspace token it fails
      # "Unauthorized"; the environment is selected by ID instead.
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: decf00e4-f5a4-43df-b338-6698be87c5a1
      TARGET_ENV: ${{ github.event_name == 'pull_request' && format('szczur-radar-pr-{0}', github.event.pull_request.number) || 'production' }}
      # PR envs track the PR branch; .railway/railway.ts uses this for non-production
      # envs so the apply does not rewrite source.branch. Empty on push to main.
      IAC_SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
      # Limits of the deploy guard and the post-apply check (tools/deploy-gate/README.md).
      # Their sum must stay inside the 2 h Wait for CI window: never raise one
      # without lowering the other.
      DEPLOY_GUARD_TIMEOUT: 90m
      DEPLOY_GUARD_INTERVAL: 60s
      DEPLOY_GUARD_WAKE_TIMEOUT: 3m
      DEPLOY_VERIFY_TIMEOUT: 15m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install railway/iac SDK (repo root)
        run: npm ci
      - name: Install Railway CLI (pinned)
        run: npm install --global @railway/cli@5.67.1 && railway --version
      - name: Check token
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::secret RAILWAY_API_TOKEN (workspace token) is not available"
            exit 1
          fi
      - name: Resolve environment ID for ${{ env.TARGET_ENV }}
        run: |
          # A new PR's Railway environment may still be being created: retry.
          env_id=""
          for attempt in $(seq 1 12); do
            env_id=$(railway environment list --json \
              | jq -r --arg name "$TARGET_ENV" \
                  '[.environments[] | select(.name == $name) | .id] | if length == 1 then .[0] else "" end')
            if [ -n "$env_id" ]; then break; fi
            echo "Environment '$TARGET_ENV' not found yet (attempt $attempt/12); retrying in 15s"
            sleep 15
          done
          if [ -z "$env_id" ]; then
            echo "::error::Railway environment '$TARGET_ENV' not found in project $RAILWAY_PROJECT_ID. For a PR, check that Railway PR Environments are enabled and the PR env was created, then re-run this job."
            exit 1
          fi
          echo "RAILWAY_ENVIRONMENT_ID=$env_id" >> "$GITHUB_ENV"
      - name: Ensure PR-env LLM settings
        # Every Spring context needs LLM_API_PROVIDER / LLM_MODEL / LLM_API_KEY
        # (szczur-radar-api/README.md). A new PR env copies unsealed variables
        # from production — including production's key — or starts without a
        # sealed one. PR envs therefore always get the CI settings (repository
        # variables + the LLM_API_KEY secret, a non-production key): written only
        # when they differ, never printed, never on production.
        if: github.event_name == 'pull_request'
        env:
          CI_LLM_API_PROVIDER: ${{ vars.LLM_API_PROVIDER }}
          CI_LLM_MODEL: ${{ vars.LLM_MODEL }}
          CI_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -o pipefail
          if [ "$TARGET_ENV" = "production" ]; then
            echo "::error::refusing to set LLM settings on production"
            exit 1
          fi
          if [ -z "$CI_LLM_API_PROVIDER" ] || [ -z "$CI_LLM_MODEL" ] || [ -z "$CI_LLM_API_KEY" ]; then
            echo "::error::GitHub Actions LLM_API_PROVIDER/LLM_MODEL variables or LLM_API_KEY secret missing"
            exit 1
          fi
          current=$(railway variable list -s szczur-radar-api -e "$TARGET_ENV" --json)
          for name in LLM_API_PROVIDER LLM_MODEL LLM_API_KEY; do
            desired_var="CI_$name"
            desired="${!desired_var}"
            if [ "$(printf '%s' "$current" | jq -r --arg n "$name" '.[$n] // ""')" = "$desired" ]; then
              echo "$name already set in $TARGET_ENV"
            else
              printf '%s' "$desired" \
                | railway variable set "$name" --stdin -s szczur-radar-api -e "$TARGET_ENV" --skip-deploys >/dev/null
              echo "Set $name in $TARGET_ENV"
            fi
          done
          # Optional provider-specific settings (LLM_SERVICE_TIER, LLM_REASONING_EFFORT,
          # LLM_TIMEOUT) copied from production belong to production's provider: with
          # the CI provider they fail the startup validation (e.g. `flex` is
          # openrouter-only). PR envs run on their defaults, so copied ones are removed.
          for name in LLM_SERVICE_TIER LLM_REASONING_EFFORT LLM_TIMEOUT; do
            if printf '%s' "$current" | jq -e --arg n "$name" 'has($n)' >/dev/null; then
              railway variable delete "$name" -s szczur-radar-api -e "$TARGET_ENV" >/dev/null
              echo "Removed $name copied into $TARGET_ENV"
            fi
          done
      - name: Ensure PR-env Wykop keys
        # The pipeline fetches Wykop with WYKOP_KEY / WYKOP_SECRET (optional:
        # without them Wykop is a not-configured source and a range run is refused
        # with 503 source_not_configured). PR envs use the same application keys as
        # production, from the GitHub secrets: written only when they differ, never
        # printed, never on production. Missing secrets only warn.
        if: github.event_name == 'pull_request'
        env:
          CI_WYKOP_KEY: ${{ secrets.WYKOP_KEY }}
          CI_WYKOP_SECRET: ${{ secrets.WYKOP_SECRET }}
        run: |
          set -o pipefail
          if [ "$TARGET_ENV" = "production" ]; then
            echo "::error::refusing to set Wykop keys on production"
            exit 1
          fi
          if [ -z "$CI_WYKOP_KEY" ] || [ -z "$CI_WYKOP_SECRET" ]; then
            echo "::warning::GitHub secrets WYKOP_KEY/WYKOP_SECRET missing: $TARGET_ENV runs without Wykop (range runs are refused)"
            exit 0
          fi
          current=$(railway variable list -s szczur-radar-api -e "$TARGET_ENV" --json)
          for name in WYKOP_KEY WYKOP_SECRET; do
            desired_var="CI_$name"
            desired="${!desired_var}"
            if [ "$(printf '%s' "$current" | jq -r --arg n "$name" '.[$n] // ""')" = "$desired" ]; then
              echo "$name already set in $TARGET_ENV"
            else
              printf '%s' "$desired" \
                | railway variable set "$name" --stdin -s szczur-radar-api -e "$TARGET_ENV" --skip-deploys >/dev/null
              echo "Set $name in $TARGET_ENV"
            fi
          done
      - name: Ensure PR-env Reddit settings
        # The pipeline reads Reddit (Arctic Shift, no key) for the subreddits in
        # REDDIT_SUBREDDITS (optional: without it Reddit is a not-configured
        # source and a range run naming it is refused with 503
        # source_not_configured). PR envs get the list from the repository
        # variable REDDIT_SUBREDDITS (S-27): written only when it differs, never
        # on production (set there by the operator after S-28, deploy-plan.md
        # S-27). Not a secret, so the value may be printed. A missing variable
        # only warns. Before "Plan and gate": the variable is declared in
        # .railway/railway.ts (preserve()), so the plan keeps it.
        if: github.event_name == 'pull_request'
        env:
          CI_REDDIT_SUBREDDITS: ${{ vars.REDDIT_SUBREDDITS }}
        run: |
          set -o pipefail
          if [ "$TARGET_ENV" = "production" ]; then
            echo "::error::refusing to set Reddit settings on production"
            exit 1
          fi
          if [ -z "$CI_REDDIT_SUBREDDITS" ]; then
            echo "::warning::repository variable REDDIT_SUBREDDITS missing: nothing written, $TARGET_ENV keeps the value it has (none, or one copied from production)"
            exit 0
          fi
          current=$(railway variable list -s szczur-radar-api -e "$TARGET_ENV" --json)
          if [ "$(printf '%s' "$current" | jq -r '.REDDIT_SUBREDDITS // ""')" = "$CI_REDDIT_SUBREDDITS" ]; then
            echo "REDDIT_SUBREDDITS already set in $TARGET_ENV: $CI_REDDIT_SUBREDDITS"
          else
            printf '%s' "$CI_REDDIT_SUBREDDITS" \
              | railway variable set REDDIT_SUBREDDITS --stdin -s szczur-radar-api -e "$TARGET_ENV" --skip-deploys >/dev/null
            echo "Set REDDIT_SUBREDDITS in $TARGET_ENV: $CI_REDDIT_SUBREDDITS"
          fi
      - name: Web address and deploy window
        # The web origin of the environment (tools/deploy-gate/web-url.sh, the one
        # mapping) and the guard's absolute deadline: this run's creation (shared
        # by every attempt of the run) + the 120 min Wait for CI window − the
        # post-apply check − 5 min. Past it Railway skips the code deploy anyway.
        # The REST API through curl, not gh: the self-hosted runners have no gh.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          usage_error() { echo "::error::$*"; exit 2; }
          web_url=$(tools/deploy-gate/web-url.sh "$TARGET_ENV")
          run_json=$(curl -fsS --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          created_at=$(jq -r '.created_at // empty' <<<"$run_json")
          [ -n "$created_at" ] || usage_error "this run's created_at is missing from the GitHub API answer"
          . tools/deploy-gate/lib.sh
          # The post-apply check may take DEPLOY_VERIFY_TIMEOUT, then /api/ready
          # DEPLOY_GUARD_WAKE_TIMEOUT; 5 min more for the plan and the apply.
          duration_seconds DEPLOY_VERIFY_TIMEOUT
          verify_timeout=$REPLY
          duration_seconds DEPLOY_GUARD_WAKE_TIMEOUT
          deadline=$(( $(date -u -d "$created_at" +%s) + 120 * 60 - verify_timeout - REPLY - 5 * 60 ))
          echo "Run created at $created_at; the deploy guard gives up at $(date -u -d "@$deadline" +%Y-%m-%dT%H:%M:%SZ)"
          echo "WEB_URL=$web_url" >> "$GITHUB_ENV"
          echo "DEPLOY_GUARD_DEADLINE=$deadline" >> "$GITHUB_ENV"
      - name: Deploy guard (no pipeline run queued or running)
        # Always, even for a plan without changes: Wait for CI deploys the code
        # after this workflow, and a deploy interrupts a pipeline run. Waits up to
        # DEPLOY_GUARD_TIMEOUT (or the deadline) while GET /api/deploy-safety says
        # a run is queued or running; an API without the route (401/404) or one
        # that cannot answer lets the deploy through with a warning. Before the
        # plan, because the pinned plan must not outlive minutes of waiting (the
        # apply refuses it once the environment changed). Repository variable
        # DEPLOY_GUARD=off turns it off (runbook S-14, deploy-plan.md).
        env:
          DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
        run: tools/deploy-gate/wait-safe.sh "$WEB_URL"
      - name: Plan and gate
        # The plan is pinned to plan.pin and the apply below applies exactly that
        # file, so what is applied is what the gate checked (the CLI refuses a
        # pinned plan once the environment changed since). The gate's rules live
        # in tools/deploy-gate/ (gate.jq, tested by deploy-gate-test): only
        # creates, updates, variable sets and domain creates, nothing destructive,
        # no source change but turning on Wait for CI (source.checkSuites → true),
        # on each change's kind, severity and details. The step summary lists the
        # changes and the services the apply may redeploy (restarts.txt: resource names).
        run: |
          plan_status=0
          railway config plan --json --out plan.pin > plan.json || plan_status=$?
          jq -r '.diff // ""' plan.json || true
          GATE_RESTARTS_FILE=restarts.txt \
            tools/deploy-gate/gate.sh plan.json "$TARGET_ENV" "$RAILWAY_PROJECT_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ "$plan_status" != "0" ]; then
            echo "::error::railway config plan exited with $plan_status"
            exit 1
          fi
          echo "PENDING_CHANGES=$(jq '.changeSet.changes | length' plan.json)" >> "$GITHUB_ENV"
      - name: Keep the plan
        # Variable values are redacted by the CLI (no --show-values); plan.pin is
        # not kept.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railway-plan-${{ env.TARGET_ENV }}
          path: plan.json
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
      - name: Deployments before the apply
        # The newest deployment ID of every service the apply may redeploy
        # (restarts.txt from the gate): the boundary above which the check below
        # looks for the apply's deployment, without comparing the runner's clock
        # with Railway's.
        if: env.PENDING_CHANGES != '0'
        run: |
          tools/deploy-gate/verify-apply.sh snapshot restarts.txt > deployments-before.json
          cat deployments-before.json
      - name: Apply to ${{ env.TARGET_ENV }}
        id: apply
        if: env.PENDING_CHANGES != '0'
        # Never --confirm-destructive: a non-interactive apply then refuses
        # destructive changes even if the gate above missed one.
        run: railway config apply --plan plan.pin --yes
      - name: Check after the apply
        # Only after an apply: each deployment the apply started (meta.patchId
        # iac-change-set/…, above the snapshot; a push's is never taken for it)
        # must deploy (SUCCESS; WAITING/QUEUED behind Wait for CI is handed over
        # to the monitor szczur-radar-monitor; none within
        # DEPLOY_VERIFY_DEPLOY_WINDOW is a notice) and /api/ready must answer
        # 200, else the job fails.
        if: steps.apply.outcome == 'success'
        run: |
          tools/deploy-gate/verify-apply.sh check restarts.txt deployments-before.json "$WEB_URL" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: API after a failed apply
        # The job is red anyway, but a failed apply may already have restarted
        # services (Postgres too): the log says whether the API still reaches its
        # database (an empty list: the check asks only /api/ready).
        if: always() && steps.apply.outcome == 'failure'
        run: |
          : > no-restarts.txt
          echo '{}' > no-deployments.json
          tools/deploy-gate/verify-apply.sh check no-restarts.txt no-deployments.json "$WEB_URL" \
            >> "$GITHUB_STEP_SUMMARY"
