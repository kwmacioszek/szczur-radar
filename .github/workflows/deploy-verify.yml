name: deploy-verify

# The health check after a code deploy (S-14, safe-deploy-gate; tools/deploy-gate/README.md).
#
# Why a separate file: Railway's Wait for CI starts the code deploy only after the
# CI workflow (ci.yml) has ended, so no step of ci.yml can see that deploy. Railway
# reports it as GitHub Deployments ("szczur-radar / <environment>") whose statuses
# trigger this workflow; tools/deploy-gate/verify-deploy.sh then asks the
# environment's web for /api/ready and /healthz and opens (or comments on) an issue
# labelled deploy-health when the deploy failed or a probe did. A human closes it.
#
# Why it never ends red: Wait for CI waits for the conclusion of EVERY workflow at
# a commit, and this one runs at the deployed commit. A red run would make Railway
# skip a redeploy of the same commit (`railway redeploy`, possibly the fix). An
# unhealthy deploy therefore ends green with an issue; only a failing gh (the
# alarm did not get through) fails the run. Events other than a final state, or of
# another Railway project, skip the job (skipped never blocks Wait for CI and uses
# no runner minutes). No concurrency group either: a pending run cancelled by a
# newer one would end "cancelled" at the commit.
on: deployment_status

jobs:
  verify:
    name: deploy verify (/api/ready, /healthz)
    if: >-
      (github.event.deployment_status.state == 'success' ||
       github.event.deployment_status.state == 'failure' ||
       github.event.deployment_status.state == 'error') &&
      startsWith(github.event.deployment.environment, 'szczur-radar / ')
    runs-on: ubuntu-latest
    # gh opens or comments on the deploy-health issue (and creates the label);
    # checkout needs contents: read. A permissions block drops every other scope.
    permissions:
      issues: write
      contents: read
    # Above the probes' wake-up window (DEPLOY_GUARD_WAKE_TIMEOUT) and gh: a
    # timed-out run ends red, which this workflow must not.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - name: Check the deployed environment
        # Event fields only through env (never interpolated into the script).
        env:
          DEPLOY_STATE: ${{ github.event.deployment_status.state }}
          DEPLOY_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_GUARD_WAKE_TIMEOUT: 3m
        run: tools/deploy-gate/verify-deploy.sh >> "$GITHUB_STEP_SUMMARY"
