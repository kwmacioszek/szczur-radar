name: szczur-radar-local

services:
  postgres:
    # Match the Railway service image without importing production PITR settings.
    image: ghcr.io/railwayapp-templates/postgres-ssl:18
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: szczur_local
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: szczur_radar_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U szczur_local -d szczur_radar_local"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./szczur-radar-web
    environment:
      PORT: "8080"
      # Docker Desktop routes this name to the API running on the Mac.
      API_PRIVATE_DOMAIN: host.docker.internal
      API_PORT: "8000"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
