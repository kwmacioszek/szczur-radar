<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The font alias of the visual tests (F-06), and of nothing else: playwright.visual.config.ts hands this file to the
  browser as FONTCONFIG_FILE. In the Playwright image `system-ui` would resolve to WenQuanYi Zen Hei (no bold, Polish
  letters from another font); here the app's families (the sans and mono tokens of style.css: system-ui … sans-serif,
  ui-monospace … monospace) resolve to Liberation Sans and Liberation Mono, which the image has. A user's typeface still
  depends on their own system. visual/font.spec.ts is red when the browser draws the text with anything but Liberation
  Sans. (No double hyphen in this comment: XML forbids it, and fontconfig would then ignore the whole file.)
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>

  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ui-monospace</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Mono</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Mono</string></edit>
  </match>
</fontconfig>
